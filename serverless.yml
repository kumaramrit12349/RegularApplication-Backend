service: applyindia-backend
frameworkVersion: "3"
useDotenv: true

custom:
  corsOrigins:
    dev:
      - http://localhost:5173
      - https://dev.applyindia.online
    prod:
      - https://applyindia.online

package:
  patterns:
    - dist/**
    - node_modules/**
    - '!src/**'
    - '!.git/**'
    - '!*.md'

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-south-1
  stage: ${opt:stage, 'dev'}

  deploymentBucket:
    name: applyindia-${self:provider.stage}-serverless-deployments-ap-south-1 

  ################################
  # ✅ ENVIRONMENT VARIABLES
  ################################
  environment:
    APP_ENV: ${self:provider.stage}
    RUNTIME_ENV: lambda
    DYNAMODB_TABLE_NAME: ${env:DYNAMODB_TABLE_NAME}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID}
    COGNITO_DOMAIN: ${env:COGNITO_DOMAIN}
    GOOGLE_CALLBACK_URL: ${env:GOOGLE_CALLBACK_URL}
    FRONTEND_URL: ${env:FRONTEND_URL}
    # Notification distribution — all optional, default empty so deploys
    # don't fail if they're not set in the deploy environment.
    SES_SENDER_EMAIL: ${env:SES_SENDER_EMAIL, 'support@applyindia.online'}
    # Notification delivery fan-out queues (see resources: below) — Refs to
    # CloudFormation resources in this same template, not env-var overrides.
    NOTIFICATION_FANOUT_QUEUE_URL: !Ref NotificationFanoutQueue
    NOTIFICATION_EMAIL_JOBS_QUEUE_URL: !Ref NotificationEmailJobsQueue
    NOTIFICATION_SOCIAL_QUEUE_URL: !Ref NotificationSocialQueue
    # Telegram Bot API — optional, publishing no-ops (skipped) if unset.
    TELEGRAM_BOT_TOKEN: ${env:TELEGRAM_BOT_TOKEN, ''}
    TELEGRAM_CHANNEL_ID: ${env:TELEGRAM_CHANNEL_ID, ''}

  ################################
  # ✅ IAM PERMISSIONS
  ################################
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:Scan
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/ApplyIndia-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/ApplyIndia-${self:provider.stage}/index/*
        - Effect: Allow
          Action:
            - cognito-idp:ListUsers
          Resource:
            - arn:aws:cognito-idp:${self:provider.region}:*:userpool/*
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:SendMessageBatch
          Resource:
            - !GetAtt NotificationFanoutQueue.Arn
            - !GetAtt NotificationEmailJobsQueue.Arn
            - !GetAtt NotificationSocialQueue.Arn
        - Effect: Allow
          Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            - sqs:ChangeMessageVisibility
          Resource:
            - !GetAtt NotificationFanoutQueue.Arn
            - !GetAtt NotificationEmailJobsQueue.Arn
            - !GetAtt NotificationSocialQueue.Arn

  ################################
  # ✅ HTTP API + CORS + COGNITO
  ################################
  httpApi:
    cors:
      allowedOrigins: ${self:custom.corsOrigins.${self:provider.stage}}
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowCredentials: true   # ✅ CORRECT for Bearer tokens

    # authorizers:
    #   cognitoJwtAuthorizer:
    #     type: jwt
    #     identitySource: $request.header.Authorization
    #     issuerUrl: https://cognito-idp.${self:provider.region}.amazonaws.com/${env:COGNITO_USER_POOL_ID}
    #     audience:
    #       - ${env:COGNITO_CLIENT_ID}

################################
# ✅ FUNCTIONS
################################
functions:
  public:
    handler: dist/lambda.handler
    events:
      - httpApi:
          path: /public/{proxy+}
          method: ANY

  auth:
    handler: dist/lambda.handler
    events:
      - httpApi:
          path: /auth/{proxy+}
          method: ANY

  private:
    handler: dist/lambda.handler
    timeout: 29   # API Gateway HTTP API's hard integration ceiling is 30s anyway
    events:
      - httpApi:
          path: /api/{proxy+}
          method: ANY

          # authorizer:
          #   name: cognitoJwtAuthorizer

  # ─── Notification Delivery Fan-Out ────────────────────────────────────────
  # approveNotification() publishes one event here instead of sending emails
  # inline. This Lambda enumerates eligible users (paged, bounded memory) and
  # enqueues one send job per user to the email jobs queue below.
  notificationFanout:
    handler: dist/notification-delivery/notificationFanoutLambda.handler
    timeout: 900
    memorySize: 1024
    description: "Enumerates eligible users and enqueues per-user notification send jobs"
    events:
      - sqs:
          arn: !GetAtt NotificationFanoutQueue.Arn
          batchSize: 1

  # ─── Email Sender ──────────────────────────────────────────────────────────
  # Sends one batch of email jobs via SES. maximumConcurrency (on the SQS
  # trigger, not a function-level reservedConcurrency) caps how many of these
  # run at once so SES's rate limits are respected, without reserving
  # account-wide concurrency — reservedConcurrency would fail to deploy on
  # accounts with a low total concurrency quota (e.g. free tier), since AWS
  # requires at least 10 units to stay unreserved account-wide.
  notificationEmailSender:
    handler: dist/notification-delivery/notificationEmailSenderLambda.handler
    timeout: 30
    memorySize: 256
    description: "Sends a batch of email notification jobs via SES"
    events:
      - sqs:
          arn: !GetAtt NotificationEmailJobsQueue.Arn
          batchSize: 10
          maximumBatchingWindow: 5
          maximumConcurrency: 5
          functionResponseType: ReportBatchItemFailures

  # ─── Social Post Publisher ─────────────────────────────────────────────────
  # approveNotification() (and the retry-social route) publish one event here
  # per notification — a single Telegram API call, not a per-user fan-out, so
  # unlike email this doesn't need a second "jobs" queue.
  notificationSocialPublisher:
    handler: dist/notification-delivery/notificationSocialLambda.handler
    timeout: 30
    memorySize: 256
    description: "Publishes an approved notification to configured social channels (currently Telegram)"
    events:
      - sqs:
          arn: !GetAtt NotificationSocialQueue.Arn
          batchSize: 1

  # ─── Scraper Lambda ────────────────────────────────────────────────────────
  # Triggered by EventBridge every 4 hours.
  # Independently deployable from the Express API.
  scraper:
    handler: dist/scraper/scraperLambda.handler
    timeout: 300      # 5 minutes — scraping multiple sites
    memorySize: 512
    description: "Scheduled scraper for government job, admission, and entrance exam notifications"
    events:
      - schedule:
          rate: rate(4 hours)
          enabled: false # Disabled: Using manual trigger from Admin Dashboard as per user request
          name: applyindia-scraper-${self:provider.stage}
          description: "Triggers the notification scraper every 4 hours (Currently Disabled)"

################################
# ✅ RESOURCES (Notification delivery SQS queues + dead-letter queues)
################################
resources:
  Resources:
    NotificationFanoutDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: applyindia-${self:provider.stage}-notification-fanout-dlq
        MessageRetentionPeriod: 1209600   # 14 days

    NotificationFanoutQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: applyindia-${self:provider.stage}-notification-fanout
        VisibilityTimeout: 960            # fan-out Lambda timeout (900s) + buffer
        MessageRetentionPeriod: 345600    # 4 days
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt NotificationFanoutDLQ.Arn
          maxReceiveCount: 3

    NotificationEmailJobsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: applyindia-${self:provider.stage}-notification-email-jobs-dlq
        MessageRetentionPeriod: 1209600

    NotificationEmailJobsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: applyindia-${self:provider.stage}-notification-email-jobs
        VisibilityTimeout: 180            # 6x the email sender Lambda's 30s timeout
        MessageRetentionPeriod: 345600
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt NotificationEmailJobsDLQ.Arn
          maxReceiveCount: 5

    NotificationSocialDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: applyindia-${self:provider.stage}-notification-social-dlq
        MessageRetentionPeriod: 1209600

    NotificationSocialQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: applyindia-${self:provider.stage}-notification-social
        VisibilityTimeout: 180            # 6x the social publisher Lambda's 30s timeout
        MessageRetentionPeriod: 345600
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt NotificationSocialDLQ.Arn
          maxReceiveCount: 5